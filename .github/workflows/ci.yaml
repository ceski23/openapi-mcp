on:
    push:

name: Build and test
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Run linter
              run: bun run lint

            - name: Install oasdiff (required for diff_specs tests)
              run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | version=1.25.1 sudo sh

            - name: Run tests
              run: bun run test

            - name: Run type checks
              run: bun run typecheck

            - name: Build library
              run: bun run build

            - name: Check configuration
              run: bun run check:config
